<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إبرة الهلاك - Needle in a Haystack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- شاشة العنوان -->
        <div id="start-screen" class="screen active">
            <h1>كومة القش المرعبة</h1>
            <p>ابحث عن الإبرة الملعونة داخل الكومة قبل أن تلتهمك المقالب!</p>
            <button id="start-btn" class="btn">ابدأ البحث المجنون</button>
        </div>

        <!-- شاشة اللعب الرئيسية -->
        <div id="game-screen" class="screen">
            <header class="game-header">
                <div class="stat-box">الوقت: <span id="timer">30</span>ث</div>
                <div class="stat-box">طاقة اليد: <span id="energy">100</span>%</div>
            </header>

            <div class="haystack-area" id="haystack">
                <!-- القش سيتم توليده ديناميكياً هنا -->
                <div class="instruction-overlay" id="hint-msg">حرك أصبعك واعفس القش هنا!</div>
            </div>

            <div class="radar-box">
                <div class="radar-text" id="radar-hint">الاقتراب من الإبرة: هادئ...</div>
            </div>
        </div>

        <!-- شاشة النهاية (فوز / خسارة) -->
        <div id="end-screen" class="screen">
            <h2 id="end-title">انتهت اللعبة</h2>
            <p id="end-desc">النصيحة: لا تبحث عن إبرة في كومة قش مجدداً!</p>
            <button id="restart-btn" class="btn">إعادة المحاولة</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
